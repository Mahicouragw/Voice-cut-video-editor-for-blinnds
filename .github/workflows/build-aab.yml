name: Android test APK and optional signed AAB
on:
  pull_request:
    paths: ['flutter_app/**', 'web/**', 'index.html', 'scripts/**', '.github/workflows/build-aab.yml']
  workflow_dispatch:
    inputs:
      signed_release:
        type: boolean
        default: false
        description: Build signed AAB using your four Android signing secrets
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true
      - run: bash scripts/prepare-android.sh
      - working-directory: flutter_app
        run: flutter pub get && flutter analyze --no-fatal-infos
      - working-directory: flutter_app
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: voicecut-debug-apk-NOT-FOR-PLAY-STORE
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Build signed Play Store bundle only when requested
        if: github.event_name == 'workflow_dispatch' && inputs.signed_release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 scripts/android-signing.py
          cd flutter_app
          flutter build appbundle --release --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.signed_release
        with:
          name: voicecut-signed-aab
          path: flutter_app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
      - name: Remove signing material
        if: always()
        run: rm -f flutter_app/android/app/upload-keystore.jks flutter_app/android/key.properties
